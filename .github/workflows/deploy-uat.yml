name: Deploy to UAT

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (use PR branch name or commit SHA)'
        required: true
        default: 'main'

jobs:
  check-validations:
    name: Check Validations Passed
    runs-on: ubuntu-latest
    outputs:
      validations_passed: ${{ steps.check.outputs.result }}
    steps:
      - name: Check if validations passed for this commit
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const ref = '${{ inputs.branch }}';

            // Get the commit SHA for the branch
            const { data: refData } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${ref.replace('refs/heads/', '')}`
            });
            const sha = refData.object.sha;

            // Get check runs for this commit
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });

            // Look for validation workflow checks
            const validationChecks = checkRuns.check_runs.filter(run =>
              run.name.includes('PRODUCTION') || run.name.includes('UAT')
            );

            if (validationChecks.length === 0) {
              core.setFailed('❌ No validations found for this commit. Run validations first.');
              return 'failed';
            }

            const allPassed = validationChecks.every(check => check.conclusion === 'success');

            if (!allPassed) {
              const failedChecks = validationChecks.filter(c => c.conclusion !== 'success');
              core.setFailed(`❌ Validations failed or incomplete: ${failedChecks.map(c => c.name).join(', ')}`);
              return 'failed';
            }

            console.log('✅ All validations passed');
            return 'success';

  deploy:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: check-validations
    if: ${{ needs.check-validations.outputs.validations_passed == 'success' && github.actor != 'dependabot[bot]' }}
    environment:
      name: UAT
      url: https://uat.salesforce.com
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '23'

      - name: 'Checkout source code'
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: 'Install Salesforce CLI'
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir -p ~/cli/sf
          tar xJf sf-linux-x64.tar.xz -C ~/cli/sf --strip-components 1
          export PATH="$HOME/cli/sf/bin:$PATH"
          ~/cli/sf/bin/sf version

      - name: 'Install sf-git-delta plugin'
        run: |
          echo y | ~/cli/sf/bin/sf plugins install sfdx-git-delta
          ~/cli/sf/bin/sf plugins

      - name: 'Installing java'
        run: |
          sudo apt-get update
          sudo apt install default-jdk

      - name: 'Populate auth file with SFDX_URL secret'
        shell: bash
        run: echo "${{ secrets.SFDX_UAT_URL }}" > ./SFDX_URL.txt

      - name: 'Authenticate to UAT Org'
        run: ~/cli/sf/bin/sf org login sfdx-url --sfdx-url-file ./SFDX_URL.txt --alias uat

      - name: 'Create delta packages for PR changes'
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Comparing to: origin/main ($(git rev-parse origin/main))"
          git diff --name-only origin/main...HEAD
          mkdir changed-sources
          ~/cli/sf/bin/sf sgd source delta --to "HEAD" --from "origin/main" --output-dir changed-sources/ --generate-delta --source-dir force-app/ || echo "Delta generation failed, will deploy all source"
          echo "Contents of changed-sources:"
          ls -la changed-sources/ || echo "Directory not found"
          if [ -d "changed-sources/force-app" ]; then
            echo "Contents of changed-sources/force-app:"
            ls -la changed-sources/force-app/
          fi

      - name: 'Deploy changes to UAT'
        run: |
          if [ -d "changed-sources/force-app" ] && [ "$(ls -A changed-sources/force-app)" ]; then
            echo "Deploying delta changes..."
            ~/cli/sf/bin/sf project deploy start --source-dir changed-sources/force-app --test-level RunLocalTests --target-org uat
          else
            echo "No delta changes found or delta failed, deploying all source..."
            ~/cli/sf/bin/sf project deploy start --source-dir force-app --test-level RunLocalTests --target-org uat
          fi
